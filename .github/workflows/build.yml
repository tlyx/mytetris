name: Build

on:
  push:
    branches:
      - main     # 🎯 main 分支推送：日常增量测试（ubuntu，公开仓库免费）
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
      - '.aiderignore'
      - 'screenshots/**'

# 🔒 严格遵循“最小权限原则”：全局不赋予任何写权限，默认全只读。
permissions:
  contents: read

jobs:
  test:
    name: Test (pytest + ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Dependencies
        run: uv sync

      - name: Run Tests
        run: uv run pytest -q

      - name: Lint
        run: uv run ruff check .
