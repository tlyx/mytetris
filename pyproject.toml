[project]
name = "mytetris"
version = "0.9.14-dev"
description = "Homemade MyTetris with AI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pygame-ce>=2.5.7",
    "platformdirs>=3.0.0",
]

[dependency-groups]
dev = [
    "pillow>=12.2.0",
    "pyinstaller>=6.21.0",
    "pytest>=9.1.1",
    "ruff>=0.9",
]

# 最小 ruff 配置：固定项目根目录，使 import 分类不随运行目录变化
# （无配置时 ruff 把当前目录当项目根，tests/ 下运行会把本地模块
#   误判为第三方，导致 I001 排序在不同目录下互相矛盾）。
[tool.ruff]
src = ["src"]
